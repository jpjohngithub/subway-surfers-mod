<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="vortex" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#0284c7" stop-opacity="0.6"/>
      <stop offset="85%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="metalRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <pattern id="hazard" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="20" height="40" fill="#f59e0b"/>
      <rect x="20" width="20" height="40" fill="#1e293b"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Base Plate -->
  <rect x="10" y="10" width="492" height="492" rx="36" fill="url(#metalRim)" stroke="#334155" stroke-width="8"/>

  <!-- Hazard Border Stripes -->
  <rect x="24" y="24" width="464" height="464" rx="28" fill="none" stroke="url(#hazard)" stroke-width="26"/>

  <!-- Inner Vent Housing Well -->
  <rect x="52" y="52" width="408" height="408" rx="20" fill="url(#vortex)" stroke="#0ea5e9" stroke-width="5"/>

  <!-- Recessed Pit Circle -->
  <circle cx="256" cy="256" r="185" fill="#090d16" stroke="#1e293b" stroke-width="10"/>

  <!-- 4-Blade Industrial Fan Propeller -->
  <g transform="rotate(25 256 256)">
    <!-- Blade 1 (North) -->
    <path d="M236 240 C210 150 200 90 256 75 C310 90 290 150 276 240 Z" fill="url(#bladeGrad)" stroke="#1e293b" stroke-width="3"/>
    <!-- Blade 2 (East) -->
    <path d="M272 236 C362 210 422 200 437 256 C422 310 362 290 272 276 Z" fill="url(#bladeGrad)" stroke="#1e293b" stroke-width="3"/>
    <!-- Blade 3 (South) -->
    <path d="M276 272 C290 362 310 422 256 437 C200 422 210 362 236 272 Z" fill="url(#bladeGrad)" stroke="#1e293b" stroke-width="3"/>
    <!-- Blade 4 (West) -->
    <path d="M240 276 C150 290 90 310 75 256 C90 200 150 210 240 236 Z" fill="url(#bladeGrad)" stroke="#1e293b" stroke-width="3"/>
  </g>

  <!-- Central Hub Rotor -->
  <circle cx="256" cy="256" r="48" fill="#334155" stroke="#94a3b8" stroke-width="5"/>
  <circle cx="256" cy="256" r="28" fill="#0284c7" stroke="#38bdf8" stroke-width="4"/>
  <circle cx="256" cy="256" r="10" fill="#f8fafc"/>

  <!-- Protective Safety Grate Slats -->
  <g stroke="#64748b" stroke-width="6" stroke-linecap="round" opacity="0.85">
    <line x1="100" y1="120" x2="412" y2="120"/>
    <line x1="80" y1="180" x2="432" y2="180"/>
    <line x1="70" y1="256" x2="442" y2="256"/>
    <line x1="80" y1="332" x2="432" y2="332"/>
    <line x1="100" y1="392" x2="412" y2="392"/>
    <line x1="120" y1="100" x2="120" y2="412"/>
    <line x1="180" y1="80" x2="180" y2="432"/>
    <line x1="256" y1="70" x2="256" y2="442"/>
    <line x1="332" y1="80" x2="332" y2="432"/>
    <line x1="392" y1="100" x2="392" y2="412"/>
  </g>

  <!-- Glowing Cyan Wind Updraft Vortex Rings -->
  <g filter="url(#glow)">
    <circle cx="256" cy="256" r="140" fill="none" stroke="#38bdf8" stroke-width="6" stroke-dasharray="35 25" opacity="0.85"/>
    <circle cx="256" cy="256" r="95" fill="none" stroke="#7dd3fc" stroke-width="5" stroke-dasharray="25 20" opacity="0.9"/>
    <!-- Updraft Arrows -->
    <path d="M256 160 L240 185 L250 185 L250 215 L262 215 L262 185 L272 185 Z" fill="#38bdf8"/>
    <path d="M256 300 L240 325 L250 325 L250 355 L262 355 L262 325 L272 325 Z" fill="#38bdf8" transform="rotate(180 256 327)"/>
  </g>
</svg>