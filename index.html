    <title>Subwaysurf2 - JohnSurf</title>
    <style>
        body, html { 
            margin: 0;
            height: 100%;
            background-color: #0b316b;
            overflow: hidden;
            background-image: url('assets/preload/splash.png');
            background-repeat: no-repeat;
            background-position: center;
        }

        #message {
            text-align: center;
            font-size: 8px;
            z-index: 5;
            font-family: "Verdana", sans-serif;
            color: #fff;
            position: fixed;
            width: 100%;
            z-index: 9999;
        }

        .dot {
            display: inline;
            margin-left: 0.2em;
            margin-right: 0.2em;
            position: relative;
            top: -1em;
            font-size: 3.5em;
            opacity: 0;
            animation: showHideDot 2.5s ease-in-out infinite;
        }

        .dot.one { animation-delay: 0.2s; }
        .dot.two { animation-delay: 0.4s; }
        .dot.three { animation-delay: 0.6s; }

        @keyframes showHideDot {
            0% { opacity: 0; }
            50% { opacity: 1; }
            60% { opacity: 1; }
            100% { opacity: 0; }
        }

    
        /* Hide Netlify drawer & badge completely */
        [class*="netlify"],
        [id*="netlify"],
        [href*="netlify.com"],
        netlify-drawer,
        #netlify-drawer,
        .netlify-badge,
        #nl-badge-frame,
        iframe[src*="netlify"],
        iframe[title*="Netlify"],
        iframe[srcdoc*="Netlify"],
        script[src*=".netlify/scripts"],
        [data-netlify-site-id],
        [data-nf-variant] {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
            position: absolute !important;
            top: -9999px !important;
            left: -9999px !important;
            width: 0 !important;
            height: 0 !important;
            z-index: -9999 !important;
        }
            html, body, canvas { touch-action: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; overscroll-behavior: none; }

<body>
    <script>
        window.NOSW = true;
        window.GAME_CONFIG = {
            pokiSdkDebug: false,
            leaderboard: 'mockup',
            bundlesPath: './bundles',
        }
        // https://github.com/pixijs/pixijs/issues/9414
        delete Array.prototype.group;
        // Performance: cap render resolution on high-DPR phones (big fill-rate saving)
        (function () {
            var real = window.devicePixelRatio || 1;
            var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
            var cap = coarse ? 1.5 : 2;
            window.__dprCap = cap;
            try { Object.defineProperty(window, 'devicePixelRatio', { get: function () { return Math.min(real, cap); }, configurable: true }); } catch (e) {}
        })();
    </script>
    <div id="message">
        <h1>Loading</h1>
        <h1 class="dot one">.</h1><h1 class="dot two">.</h1><h1 class="dot three">.</h1>
    </div>
